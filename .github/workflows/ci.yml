name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: centinela
          POSTGRES_PASSWORD: centinela
          POSTGRES_DB: centinela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U centinela -d centinela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://centinela:centinela@localhost:5432/centinela
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Migraciones contra PostgreSQL
        run: pnpm db:migrate
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: centinela
          POSTGRES_PASSWORD: centinela
          POSTGRES_DB: centinela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U centinela -d centinela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://centinela:centinela@localhost:5432/centinela
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Instalar Chromium (Playwright)
        run: pnpm --filter @centinela/e2e exec playwright install --with-deps chromium
      - name: Extremo a extremo
        run: pnpm e2e
